# Posts videos/<slug>/ to YouTube when their publish_at time arrives.
# Runs on every push to the default branch, and on a pipeline schedule (Build > Pipeline schedules,
# e.g. hourly) so scheduled videos go out on time. Needs masked CI/CD variables
# YT_CLIENT_ID, YT_CLIENT_SECRET and YT_REFRESH_TOKEN (set by authorize.py).
stages: [check, publish]

default:
  image: python:3.12-slim

check:
  stage: check
  before_script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null
  script:
    - python3 publish.py --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

publish:
  stage: publish
  resource_group: youtube   # never two uploads at once
  script:
    - python3 publish.py
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $YT_REFRESH_TOKEN && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
