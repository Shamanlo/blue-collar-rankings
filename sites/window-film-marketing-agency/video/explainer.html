<script>
const FMT = new URLSearchParams(location.search).get("format") === "reel" ? "reel" : "wide";
const wide = FMT === "wide";
const $ = (id) => document.getElementById(id);
$("stage").className = FMT;
const cl = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const P = (t, a, d) => cl((t - a) / d);
const mix = (a, b, x) => a + (b - a) * x;
const E = {
  outC: (x) => 1 - Math.pow(1 - x, 3), inC: (x) => x * x * x,
  ioC: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outX: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  outB: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
const bump = (t, t0, len = .25) => (t < t0 || t - t0 > len * 3 ? 0 : Math.exp(-(t - t0) / len * 3));
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function T(el, { x = 0, y = 0, s = 1, r = 0, o = null, b = null } = {}) {
  el.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
  if (o !== null) el.style.opacity = cl(o).toFixed(3);
  if (b !== null) el.style.filter = b > .1 ? `blur(${b.toFixed(2)}px)` : "none";
}
function lines(el, t, ins, dur = .7) {
  el.querySelectorAll(".ln>span").forEach((s, i) => { s.style.transform = `translate3d(0,${((1 - E.outX(P(t, ins[i] ?? ins[ins.length - 1], dur))) * 118).toFixed(2)}%,0)`; });
}
function mk(el, t, a, d = .35) {
  if (!el) return;
  const x = E.outC(P(t, a, d));
  el.style.setProperty("--hl", x.toFixed(3));
  el.style.color = x > .5 ? "#0B1622" : "#FFB21E";
}
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.6 4.9 4.6 8.9 9.5 9.5-4.9.6-8.9 4.6-9.5 9.5-.6-4.9-4.6-8.9-9.5-9.5 4.9-.6 8.9-4.6 9.5-9.5z"/></svg>',
};
const COMP = ["Rival Tint Co.", "Competitor Film Pros", "The Other Guys Tint", "Coastal Glass & Film", "Metro Window Tinting", "Sunline Film Co.", "Premier Tint", "Valley Window Film", "Clear View Tinting", "Pro Glass Coatings", "Summit Window Film", "Bayside Tint", "Allied Film Works"];
const URL_TXT = "windowfilmmarketingagency.com";
const LP = wide ? [[21, 21, -660, -420, -120], [94, 21, 720, -400, 140], [21, 94, -740, 480, 90], [94, 94, 680, 500, -160]]
                : [[30, 30, -660, -820, -120], [136, 30, 720, -760, 140], [30, 136, -740, 880, 90], [136, 136, 680, 920, -160]];
let PLAN, W, H, pending = [], built = null;

function setImg(img, url) {
  if (img.dataset.u === url) return;
  img.dataset.u = url; img.src = url;
  pending.push(img.decode().catch(() => { window.renderError = "could not load " + url; }));
}
function fit(el, maxW, base) {
  el.style.fontSize = base + "px";
  const spans = [...el.querySelectorAll(".ln>span")];
  const w = spans.length ? Math.max(...spans.map((s) => s.offsetWidth)) : el.scrollWidth;
  if (w > maxW) el.style.fontSize = (base * maxW / w).toFixed(1) + "px";
}

// ---------- per-segment setup (runs once when a segment starts) ----------
function setup(seg) {
  if (built === seg) return;
  built = seg;
  if (seg.kind === "hook") {
    $("hKick").textContent = seg.kicker;
    $("hLines").innerHTML = seg.lines.map((l, i) => `<span class="ln"><span>${i === seg.mark ? `<mark id="hMk">${esc(l)}</mark>` : esc(l)}</span></span>`).join("");
    fit($("hLines"), wide ? 1700 : 916, wide ? 170 : 150);
  } else if (seg.kind === "outro") {
    $("oHead").innerHTML = wide
      ? `<span class="ln"><span>${esc(seg.head[0])} <mark id="oMark">${esc(seg.head[1])}</mark></span></span>`
      : `<span class="ln"><span>${esc(seg.head[0])}</span></span><span class="ln"><span><mark id="oMark">${esc(seg.head[1])}</mark></span></span>`;
  } else {
    $("pips").innerHTML = Array.from({ length: seg.of }, () => "<i><b></b></i>").join("");
    $("scene").classList.toggle("hasnum", !!seg.n);
    $("num").textContent = seg.n ? "0" + seg.n : "";
    $("eye").textContent = seg.eyebrow;
    $("titleT").textContent = seg.title;
    fit($("title"), wide ? 830 : 900, 92);
    const v = seg.visual, showBul = wide || v.type === "icon";
    $("bul").style.display = showBul ? "block" : "none";
    const n = seg.bullets.length, rowH = wide ? Math.min(112, 450 / Math.max(1, n)) : Math.min(170, 820 / Math.max(1, n));
    const fs = wide ? Math.min(46, rowH * .42) : Math.min(60, rowH * .4);
    if (!wide) $("bul").style.top = Math.round(985 - n * rowH / 2) + "px";  // centre the list between title and captions
    $("bul").innerHTML = seg.bullets.map((b, i) => `<div class="bl" style="height:${rowH}px;font-size:${fs}px"><i class="${b.icon}">${b.icon === "num" ? i + 1 : ICON[b.icon]}</i><span>${esc(b.text)}</span></div>`).join("");
    $("bul").querySelectorAll(".bl span").forEach((s) => { const max = (wide ? 880 : 850) - 100; if (s.offsetWidth > max) s.style.fontSize = (fs * max / s.offsetWidth).toFixed(1) + "px"; });
    const reelIconScene = !wide && v.type === "icon";
    $("cardWrap").style.display = reelIconScene ? "none" : "block";
    document.querySelectorAll(".vis").forEach((e) => (e.style.display = "none"));
    $("credit").textContent = v.credit || "";
    // still screenshots (1440x900) get a card shaped like a browser window; tall ones scroll inside a square card
    const shortCard = v.type === "image" && !v.pan;
    $("card").style.top = shortCard ? "139px" : "0"; $("card").style.height = shortCard ? "622px" : "900px";
    if (v.type === "image") {
      $("vImg").style.display = "block"; $("imgLabel").textContent = v.label || ""; setImg($("imgEl"), "/assets/" + v.src);
    } else if (v.type === "phone") {
      $("vPhone").style.display = "block"; setImg($("phoneImg"), "/assets/" + v.src);
    } else if (v.type === "icon") {
      $("vIcon").style.display = "block"; const ic = v.icon || "check";
      $("bigIcon").className = ic; $("bigIcon").innerHTML = ic === "num" ? String(n || 3) : ICON[ic];
    } else if (v.type === "maps") {
      $("vMaps").style.display = "block";
      $("mRows").innerHTML = COMP.map((c, i) => `<div class="row" data-i="${i}"><span class="n"></span><div><b>${esc(c)}</b><small>★★★★★</small></div></div>`).join("") +
        `<div class="row you" id="youRow"><span class="n" id="youN"></span><div><b>Your Company</b><small>☆☆☆☆☆</small></div></div>`;
    } else if (v.type === "chat") {
      $("vChat").style.display = "block"; $("cQ").textContent = v.q;
    } else if (v.type === "profile") {
      $("vProf").style.display = "block";
      const rows = [["Address", "pin"], ["Phone", "phone"], ["Website", "web"], ["Hours", "clock"]];
      $("pInfo").innerHTML = rows.map(([r]) => `<div class="pi"><i>${ICON.check}</i>${r}: same on every listing</div>`).join("");
    } else if (v.type === "review") {
      $("vRev").style.display = "block";
      const i = v.text.indexOf(v.mark);
      $("rText").innerHTML = i < 0 ? esc(v.text) : `“${esc(v.text.slice(0, i))}<em id="rMark">${esc(v.mark)}</em>${esc(v.text.slice(i + v.mark.length))}”`;
    } else if (v.type === "ba") {
      $("ba").style.display = "block";
    }
  }
}

// ---------- scenes ----------
function bg(t, seg) {
  const k = seg.kind === "scene" ? seg.k : seg.kind === "outro" ? 99 : 0;
  T($("glowA"), { x: W * (k % 2 ? .82 : .2) + Math.sin(t * .4) * 40, y: H * (seg.kind === "outro" ? .28 : .16) + Math.cos(t * .33) * 40, o: seg.kind === "outro" ? 1 : .75 });
  T($("glowB"), { x: W * (k % 2 ? .12 : .86) + Math.sin(t * .3) * 60, y: H * .82 + Math.cos(t * .27) * 60, o: .85 });
  $("mullions").style.transform = `translate3d(0,${(-((t * 18) % 384)).toFixed(1)}px,0)`;
  const r = rng(Math.floor(t * 30) * 7919 + 13);
  $("grain").style.backgroundPosition = `${Math.floor(r() * 256)}px ${Math.floor(r() * 256)}px`;
  const first = PLAN.segments[1].t0;
  $("flash").style.opacity = (t < first ? Math.pow(P(t, first - .15, .15), 2) : 1 - E.outC(P(t, first, .4))) * .9;
}

function sHook(t, seg) {
  const out = E.inC(P(t, seg.t1 - .25, .25));
  const lp = P(t, .1, .55);
  T($("hMarkLogo"), { s: mix(.4, 1, E.outB(lp)) * (1 - out * .3), r: mix(-20, 0, E.outC(lp)), o: cl(lp / .2) * (1 - out) });
  T($("hKick"), { x: mix(-40, 0, E.outX(P(t, .25, .5))), o: P(t, .25, .3) * (1 - out) });
  lines($("hLines"), t, [.35, .58], .7);
  $("hLines").style.opacity = (1 - out).toFixed(3);
  mk($("hMk"), t, 1.0, .4);
}

function sScene(t, seg) {
  const u = t - seg.t0, out = cl(1 - (seg.t1 - t) / .22), inP = E.outX(P(u, 0, .55)), v = seg.visual;
  $("pips").querySelectorAll("b").forEach((b, i) => { b.style.width = (i + 1 < seg.k ? 100 : i + 1 === seg.k ? cl(u / (seg.t1 - seg.t0)) * 100 : 0).toFixed(2) + "%"; });
  const np = P(u, .08, .42);
  T($("num"), { s: mix(1.9, 1, E.outB(np)), x: -out * 90, o: cl(np / .12) * (1 - out) });
  T($("eye"), { x: mix(-30, 0, E.outX(P(u, .2, .5))) - out * 90, o: P(u, .2, .3) * (1 - out) });
  lines($("title"), u, [.18], .6);
  T($("title"), { x: -out * 90, o: 1 - out });
  $("bul").querySelectorAll(".bl").forEach((el, i) => {
    const p = P(t, seg.bullets[i].t, .45);
    el.style.opacity = (cl(p / .25) * (1 - out)).toFixed(3);
    el.style.transform = `translate3d(${(mix(60, 0, E.outX(p)) - out * 90).toFixed(1)}px,0,0)`;
    el.querySelector("i").style.transform = `scale(${E.outB(P(t, seg.bullets[i].t + .08, .4)).toFixed(3)})`;
  });
  T($("card"), { y: (1 - inP) * 170, x: -out * 140, s: mix(.92, 1, inP), o: cl(u / .18) * (1 - out), b: out * 8 });
  T($("credit"), { o: P(u, .6, .4) * (1 - out) });
  const span = seg.t1 - seg.t0;
  if (v.type === "image") {
    const img = $("imgEl"), h = img.naturalHeight ? 900 * img.naturalHeight / img.naturalWidth : 900, view = 840;
    const pan = v.pan ? -Math.max(0, h - view) * E.ioC(P(u, .9, span - 1.6)) : 0;
    img.style.transform = `translate3d(0,${pan.toFixed(1)}px,0) scale(${(1 + .04 * P(u, 0, span)).toFixed(4)})`;
  } else if (v.type === "phone") {
    T($("phoneF"), { y: Math.sin(u * 1.4) * 8 });
  } else if (v.type === "icon") {
    T($("bigIcon"), { s: mix(.3, 1, E.outB(P(u, .2, .6))) * (1 + Math.sin(u * 2.2) * .015), r: mix(-30, 0, E.outC(P(u, .2, .6))) });
  } else if (v.type === "maps") {
    const climb = v.you_to !== v.you_from ? E.ioC(P(t, v.t, 1.6)) : 0;
    const pos = mix(v.you_from, v.you_to, climb), rowH = 114.4, viewH = 572;
    const scroll = cl((pos + 1) * rowH - viewH, 0, 99999);
    $("mRows").querySelectorAll(".row[data-i]").forEach((el) => {
      const i = +el.dataset.i, y = (i + cl(i + 1 - pos)) * rowH - scroll;
      el.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`;
      el.querySelector(".n").textContent = i + 1 + (i + 1 - pos > .5 ? 1 : 0);
    });
    const alarm = v.t_alarm ? bump(t, v.t_alarm, .4) : 0, won = climb > .98;
    const you = $("youRow");
    you.style.transform = `translate3d(0,${(pos * rowH - scroll).toFixed(1)}px,0) scale(${(1 + alarm * .04 + (won ? bump(t, v.t + 1.6, .3) * .05 : 0)).toFixed(4)})`;
    const warm = climb;
    you.style.background = warm > .5 ? "#FFF7E3" : "#FFF1EF";
    you.style.boxShadow = `inset 10px 0 0 ${warm > .5 ? "#FFB21E" : "#E2564B"}, 0 ${(alarm * 20).toFixed(0)}px 40px rgba(226,86,75,${(alarm * .35).toFixed(2)})`;
    $("youN").textContent = Math.max(1, Math.round(pos) + 1);
    $("youN").style.background = warm > .5 ? "#FFB21E" : "#E2564B";
    $("youN").style.color = warm > .5 ? "#0B1622" : "#fff";
    you.querySelector("small").textContent = warm > .5 ? "★★★★★" : "☆☆☆☆☆";
    you.querySelector("small").style.color = warm > .5 ? "#F5B400" : "#9AA5B1";
    $("youPin").style.background = warm > .5 ? "#FFB21E" : "#9AA5B1";
    T($("youPin"), { x: mix(0, -400, E.outB(P(t, v.t || 0, 1.2)) * (v.you_to !== v.you_from ? 1 : 0)), r: -45, s: 1 + warm * .4 });
  } else if (v.type === "chat") {
    const names = v.you === null ? COMP.slice(0, 3) : ["Your Company", ...COMP.slice(0, 2)];
    const why = v.you === null ? ["Many reviews mention storefront security film", "Dedicated security film page", "Listed on a manufacturer dealer locator"]
                               : ["Clear security film page, same details everywhere, reviews that name the film", "Many reviews mention security film", "Dedicated security film page"];
    $("cA").innerHTML = `<p>Here are a few companies worth calling:</p>` + names.map((n, i) => {
      const p = P(t, v.t + i * .35, .4);
      return `<div class="ci${n === "Your Company" ? " you" : ""}" style="opacity:${cl(p / .3).toFixed(3)};transform:translate3d(0,${(mix(30, 0, E.outX(p))).toFixed(1)}px,0)"><span class="k">${i + 1}</span><div>${esc(n)}<small>${esc(why[i])}</small></div></div>`;
    }).join("") + (v.you === null ? `<p style="margin:18px 0 0;opacity:${P(t, v.t + 1.3, .4).toFixed(3)};color:#E2564B;font-weight:700">Your company isn't mentioned.</p>` : "");
    T($("cQ"), { y: mix(30, 0, E.outX(P(u, .2, .5))), o: P(u, .2, .25) });
    T($("cA"), { y: mix(40, 0, E.outX(P(u, .5, .5))), o: P(u, .5, .25) });
  } else if (v.type === "profile") {
    const on = v.highlight === "category" ? E.outC(P(t, v.t, .4)) : 0;
    $("pCat").style.setProperty("--hl", on.toFixed(3));
    $("pCat").classList.toggle("on", on > .5);
    $("pInfo").querySelectorAll(".pi").forEach((el, i) => el.classList.toggle("on", v.highlight === "nap" && t >= v.t + i * .3));
  } else if (v.type === "review") {
    const m = $("rMark"); if (m) m.style.setProperty("--hl", E.outC(P(t, v.t, .4)).toFixed(3));
  } else if (v.type === "ba") {
    const p = 100 - 100 * E.ioC(P(t, v.wipe[0], v.wipe[1] - v.wipe[0]));
    $("baAi").style.clipPath = `inset(0 0 0 ${p.toFixed(3)}%)`;
    $("baLine").style.left = p.toFixed(3) + "%";
    $("baLine").style.opacity = p > .4 && p < 99.6 ? 1 : 0;
    $("baB").style.opacity = p > 40 ? 1 : 0; $("baA").style.opacity = p < 60 ? 1 : 0;
  }
}

function sOutro(t, seg) {
  const u = t - seg.t0, hit = bump(t, seg.hit, .3);
  LP.forEach(([tx, ty, dx, dy, rot], i) => {
    const p = E.outX(P(u, .1 + i * .07, .75));
    T($("lp" + i), { x: tx + dx * (1 - p), y: ty + dy * (1 - p), r: rot * (1 - p), s: mix(1.7, 1, p) });
    $("lp" + i).style.opacity = (cl(P(u, .1 + i * .07, .15)) * (i === 3 ? .55 : 1)).toFixed(3);
  });
  const fp = P(u, .55, .55);
  T($("lgFrame"), { s: mix(.3, 1, E.outB(fp)), o: cl(fp / .2) });
  const ls = P(t, seg.hit - .1, .65);
  $("lgSweep").style.transform = `translate3d(${mix(-160, 300, E.ioC(ls)).toFixed(1)}px,0,0) rotate(20deg)`;
  $("lgSweep").style.opacity = ls > 0 && ls < 1 ? 1 : 0;
  T($("logo"), { s: 1 + hit * .05 });
  lines($("oWord"), u, [.95], .7);
  const sub = P(u, 1.1, .7), lsp = mix(.7, .32, E.outX(sub)).toFixed(3) + "em";
  $("oSub").style.opacity = E.outC(sub).toFixed(3); $("oSub").style.letterSpacing = lsp; $("oSub").style.paddingLeft = lsp;
  lines($("oHead"), u, wide ? [1.55] : [1.55, 1.75], .65);
  mk($("oMark"), u, wide ? 2.0 : 2.1, .35);
  const bp = P(u, 2.3, .5);
  T($("oBtn"), { s: mix(.4, 1, E.outB(bp)) * (1 + hit * .07), o: cl(bp / .15) });
  $("oBtn").style.boxShadow = `0 10px 0 #D48700, 0 30px ${(80 + hit * 80).toFixed(0)}px rgba(255,178,30,${(.35 + hit * .5).toFixed(3)})`;
  const n = cl(Math.floor((t - seg.url) / .034) + 1, 0, URL_TXT.length);
  $("oUrlT").textContent = t >= seg.url ? URL_TXT.slice(0, n) : "";
  $("oCaret").style.opacity = t > seg.url - .2 && (n < URL_TXT.length || Math.floor(t * 2.4) % 2 === 0) ? 1 : 0;
}

function captions(t) {
  const c = PLAN.captions.find((x) => t >= x.t0 && t < x.t1);
  if (!c) { $("cap").innerHTML = ""; return; }
  const chars = c.words.reduce((a, w) => a + w[0].length + 1, 0), base = wide ? 46 : 56, max = wide ? 60 : 27;
  const size = Math.min(base, base * max / chars), pop = mix(.9, 1, E.outB(P(t, c.t0, .16)));
  $("cap").innerHTML = `<div class="cap" style="font-size:${size.toFixed(1)}px;transform:scale(${pop.toFixed(4)});opacity:${cl(P(t, c.t0, .06)).toFixed(3)}">${
    c.words.map(([w, a, b]) => `<span class="w${t >= b ? " past" : t >= a - .03 ? " on" : ""}">${esc(w)}</span>`).join("")}</div>`;
}

window.render = async function (t) {
  pending = [];
  const seg = PLAN.segments.find((s) => t >= s.t0 && t < s.t1) || PLAN.segments[PLAN.segments.length - 1];
  for (const k of ["hook", "scene", "outro"]) $(k).style.display = seg.kind === k ? "block" : "none";
  setup(seg);
  bg(t, seg);
  if (seg.kind === "hook") sHook(t, seg); else if (seg.kind === "scene") sScene(t, seg); else sOutro(t, seg);
  captions(t);
  await Promise.all(pending);
};

window.ready = (async () => {
  PLAN = await (await fetch(`/assets/plan-${FMT}.json`)).json();
  window.DURATION = PLAN.duration;
  [W, H] = PLAN.size;
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), img = g.createImageData(256, 256), r = rng(9);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  $("grain").style.backgroundImage = `url(${c.toDataURL()})`;
  await document.fonts.ready;
  await Promise.all([...document.fonts].map((f) => f.load()));
  await Promise.all([...document.images].filter((i) => i.src).map((i) => i.decode().catch(() => {})));
  await window.render(0);
})();
</script>
