name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: blue-collar-rankings
      DOMAIN: bluecollarrankings.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build site
        run: npm run build

      - name: Check Cloudflare secret
        id: secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Site built but not deployed. Add CLOUDFLARE_API_TOKEN under Settings > Secrets and variables > Actions, then re-run."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find Cloudflare account
        if: steps.secret.outputs.ok == 'true'
        run: python3 tools/cloudflare_setup.py account

      - name: Create Pages project
        if: steps.secret.outputs.ok == 'true'
        run: python3 tools/cloudflare_setup.py project

      - name: Deploy
        if: steps.secret.outputs.ok == 'true'
        run: npx --yes wrangler@4.140.0 pages deploy public --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Connect bluecollarrankings.com
        if: steps.secret.outputs.ok == 'true'
        run: python3 tools/cloudflare_setup.py domains
